[graph]
exclude-dev = true

[advisories]
unmaintained = "workspace"
ignore = [
    # Unfortunately we have no control over rustls version, it is decided by
    # rustls-ffi.
    "RUSTSEC-2026-0285",
]

[licenses]
private.ignore = true
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]
