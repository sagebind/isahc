name: ci
on:
  push:
    branches: [master, "1.x", "2.x"]
  pull_request:

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy --features cookies,psl,tls-insecure,trust-webpki-roots,unstable-interceptors -- -Dwarnings

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    strategy:
      fail-fast: false
      # Set up several combinations of CPU architectures, operating systems,
      # compiler targets, and crate features to test against.
      matrix:
        include:
          # x64 + linux + rustls
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: default,cookies,psl,spnego,tls-insecure,trust-webpki-roots,unstable-interceptors

          # x64 + linux + native-tls
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: cookies,psl,tls-insecure,http2,json,native-tls,text-decoding

          # x64 + linux + musl + rustls
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: default,cookies,psl,tls-insecure,trust-webpki-roots,unstable-interceptors

          # arm + linux + rustls
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: default,cookies,psl,tls-insecure,trust-webpki-roots,unstable-interceptors

          # arm + macos + rustls
          - runner: macos-latest
            target: aarch64-apple-darwin
            features: default,cookies,psl,tls-insecure,trust-webpki-roots,unstable-interceptors

          # arm + macos + native-tls
          - runner: macos-latest
            target: aarch64-apple-darwin
            features: cookies,psl,tls-insecure,http2,json,native-tls,text-decoding

          # x64 + macos + rustls
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            features: default,cookies,psl,tls-insecure,trust-webpki-roots,unstable-interceptors

          # x64 + windows + rustls
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            features: default,cookies,psl,tls-insecure,trust-webpki-roots,unstable-interceptors

          # x64 + windows + native-tls
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            features: cookies,psl,tls-insecure,http2,json,native-tls,spnego,text-decoding

          # arm + windows + rustls
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            features: default,cookies,psl,tls-insecure,trust-webpki-roots,unstable-interceptors

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RUST_BACKTRACE: 1
      RUST_LOG: isahc=debug
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Install musl toolchain
        run: sudo apt update && sudo apt install -y musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'

      - name: Install SPNEGO dependencies
        run: sudo apt update && sudo apt install -y libkrb5-dev
        if: contains(matrix.runner, 'ubuntu') && contains(matrix.features, 'spnego')

      - name: Install target toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-

      - name: Run tests
        run: cargo nextest run --profile ci --no-default-features --features ${{ matrix.features }}

      - name: Run example program
        run: cargo run --release --example simple --no-default-features --features ${{ matrix.features }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          directory: target/nextest/ci
          flags: ${{ matrix.target }},${{ matrix.features }}
          fail_ci_if_error: false

  coverage:
    runs-on: ubuntu-latest
    container:
      image: xd009642/tarpaulin:develop-nightly
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v7

      - name: Generate code coverage
        run: |
          cargo +nightly tarpaulin --verbose --features cookies,psl,tls-insecure,trust-webpki-roots,unstable-interceptors --workspace --timeout 120 --out xml

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  docs-rs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/install@cargo-docs-rs
      - run: cargo docs-rs
